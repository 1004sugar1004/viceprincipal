<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 새해 축복 - 홍성미 교감선생님</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Nanum Myeongjo', serif;
      background-color: #050505;
    }
    #root {
      width: 100vw;
      height: 100vh;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes snowfall {
      0% { transform: translateY(-10vh) translateX(0); }
      100% { transform: translateY(110vh) translateX(20px); }
    }
    .snowflake {
      position: absolute;
      top: -10vh;
      color: white;
      pointer-events: none;
      z-index: 1;
      animation: snowfall linear infinite;
    }
    @keyframes swing {
      0%, 100% { transform: translateX(-50%) rotate(-3deg); }
      50% { transform: translateX(-50%) rotate(3deg); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in {
      animation: slideIn 0.5s ease-out forwards;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root">
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; background: #050505;">
      <div class="loading-spinner" style="margin-bottom: 20px;"></div>
      <p style="letter-spacing: 0.2em; font-size: 1.1rem; opacity: 0.8;">지혜의 숲을 불러오는 중...</p>
    </div>
  </div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
